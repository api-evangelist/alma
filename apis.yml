aid: alma
name: Alma
description: >-
  Alma is a technology-enabled U.S. immigration law firm for companies and
  individuals, combining licensed immigration attorneys with a platform that
  learns from every case it files. Alma takes end-to-end ownership of the
  employment-based immigration process — from initial assessment through
  approval — across temporary work visas (E-2, E-3, H-1B, L-1A, L-1B, O-1A,
  O-1B, TN) and employment-based green cards (EB-1A, EB-1B, EB-1C, EB-2 NIW,
  EB-2 PERM, EB-3). For employers it offers a case-management platform with
  real-time visibility, LCA/compliance tooling, spend forecasting, SSO, and
  HRIS/ATS integrations (Workday, ADP, BambooHR, UKG, and more). Alma publishes
  no public developer API; system integration is delivered through its
  enterprise plan on SOC 2 Type II infrastructure. This profile was surfaced via
  VC-portfolio discovery and enriched by the API Evangelist pipeline.
